[project]
name = "voice-action"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "anyio>=4,<5",
    "mcp>=1.26,<2",
    "openai>=2,<3",
    "jsonschema>=4,<5",
    "pyobjc-framework-ApplicationServices>=10,<13; sys_platform == 'darwin'",
    "pyobjc-framework-Cocoa>=10,<13; sys_platform == 'darwin'",
    "python-dotenv>=1,<2",
    "rich>=14,<15",
    "tkinterdnd2>=0.6.3",
]

[project.optional-dependencies]
# Meaning-based file search (VOICE_ACTION_SEMANTIC_SEARCH=on); large, so it is not a default.
semantic = [
    "sentence-transformers>=6.1,<7",
    "transformers>=5.19,<6",
    "torchvision>=0.29,<1",
    "pillow>=12,<13",
    "pillow-heif>=1.8,<2",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.12,<1"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
markers = ["integration: starts the real Node Filesystem MCP server"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
