[project]
name = "voice-action"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "anyio>=4,<5",
    "mcp>=1.26,<2",
    "openai>=2,<3",
    "jsonschema>=4,<5",
    "pyobjc-framework-ApplicationServices>=10,<13; sys_platform == 'darwin'",
    "pyobjc-framework-Cocoa>=10,<13; sys_platform == 'darwin'",
    "python-dotenv>=1,<2",
    "rich>=14,<15",
    "markdown-it-py>=3,<5",
    "tkinterweb>=4,<5",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.12,<1"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
markers = ["integration: starts the real Node Filesystem MCP server"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
